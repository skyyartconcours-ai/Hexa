<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Hexa</title>
<style>
  :root { color-scheme: dark; }
  body {
    width: 296px; margin: 0; padding: 16px;
    background: #101014; color: #e6e6ec;
    font: 13px/1.45 "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  }
  h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: .01em; }
  .sub { margin: 0 0 14px; font-size: 11.5px; color: #8a8a99; }

  label { display: block; margin-bottom: 10px; font-size: 11.5px; color: #a3a3b3; }
  input, select {
    width: 100%; margin-top: 4px; padding: 7px 9px;
    background: #1b1b22; border: 1px solid #2c2c37; border-radius: 6px;
    color: #e6e6ec; font: inherit; font-size: 12.5px;
  }
  input:focus, select:focus { outline: none; border-color: #6a5acd; }

  .row { display: flex; gap: 10px; }
  .row > label { flex: 1; }

  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; color: #a3a3b3; }
  .check input { width: auto; margin: 0; }

  button {
    width: 100%; padding: 10px; border: 0; border-radius: 7px;
    background: #6a5acd; color: #fff; font: inherit; font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #7a6ad8; }
  button.stop { background: #b5372a; }
  button.stop:hover { background: #c74436; }
  button:disabled { opacity: .55; cursor: default; }

  #msg { margin-top: 10px; font-size: 11.5px; color: #8a8a99; min-height: 30px; }
  #msg.err { color: #ff8a75; }
  #msg code {
    display: block; margin-top: 4px; padding: 4px 6px;
    background: #1b1b22; border-radius: 4px;
    font-size: 11px; color: #b9b9c6;
  }
</style>
</head>
<body>
  <h1>Hexa</h1>
  <p class="sub">Sous-titres traduits, posés sur le lecteur Twitch.</p>

  <div class="row">
    <label>Langue parlée
      <select id="sourceLang">
        <option value="it">Italien</option>
        <option value="en">Anglais</option>
        <option value="es">Espagnol</option>
        <option value="pt">Portugais</option>
        <option value="de">Allemand</option>
        <option value="ja">Japonais</option>
        <option value="ko">Coréen</option>
        <option value="ru">Russe</option>
      </select>
    </label>
    <label>Traduire en
      <select id="targetLang">
        <option value="fr">Français</option>
        <option value="en">Anglais</option>
        <option value="es">Espagnol</option>
        <option value="de">Allemand</option>
        <option value="it">Italien</option>
      </select>
    </label>
  </div>

  <label>Serveur
    <input id="serverUrl" type="text" spellcheck="false" placeholder="ws://127.0.0.1:8765">
  </label>

  <div class="row">
    <label>Taille du texte
      <input id="fontSize" type="number" min="14" max="64" step="2">
    </label>
    <label>Durée à l'écran (s)
      <input id="keepSeconds" type="number" min="2" max="20" step="1">
    </label>
  </div>

  <div class="check">
    <input id="showOriginal" type="checkbox">
    <span>Afficher aussi le texte original</span>
  </div>

  <button id="toggle">Démarrer</button>
  <div id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
