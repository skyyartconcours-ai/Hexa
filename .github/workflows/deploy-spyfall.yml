# Déploiement automatique de spyfall.skyyarttools.fr.
#
# Ce workflow ne contient AUCUNE logique de déploiement : il appelle
# deploy/deploy-vps.sh, seule source de vérité. Toute correction apportée au
# script (compte dédié, alias Caddy, safe.directory...) profite donc aussi au
# déploiement automatique, sans risque de divergence entre les deux chemins.
#
# Secrets à créer dans Settings → Secrets and variables → Actions :
#   VPS_HOST          IP ou nom du VPS
#   VPS_USER          utilisateur SSH (ex. root)
#   VPS_SSH_KEY       clé privée SSH autorisée sur le VPS
#   SPYFALL_PASSWORD  mot de passe du jeu (ex. spy)
name: Deploy spyfall.skyyarttools.fr

on:
  workflow_dispatch:
  push:
    branches: [claude/deploy-spyfall-skyy-wtj43p]

concurrency:
  group: deploy-spyfall
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Déployer
        env:
          SPYFALL_SSH_HOST: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          SPYFALL_SSH_KEY: /home/runner/.ssh/deploy_key
          SPYFALL_PASSWORD: ${{ secrets.SPYFALL_PASSWORD }}
        run: bash deploy/deploy-vps.sh deploy
