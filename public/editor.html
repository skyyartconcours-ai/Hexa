<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spyfall — Éditeur de lieux & rôles</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #14181f; color: #e8e6e3; padding-bottom: 40px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: #1a1f29; border-bottom: 1px solid #2c3442;
    padding: 12px 14px;
  }
  h1 { font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
  .stats { font-size: 0.8rem; color: #9aa3b2; margin-top: 4px; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  button, select, input {
    font-size: 0.9rem; padding: 8px 11px; border-radius: 9px;
    border: 1px solid #2c3442; background: #232b38; color: #e8e6e3;
  }
  button { cursor: pointer; font-weight: 600; }
  button:active { transform: scale(0.97); }
  button.primary { background: #5b8def; color: #fff; border-color: #5b8def; }
  button.warn { background: #b9483f; color: #fff; border-color: #b9483f; }
  button.ghost { background: transparent; }
  input[type="search"], input.grow { flex: 1; min-width: 120px; }
  main { padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }

  .deck-tag {
    font-size: 0.68rem; font-weight: 700; padding: 2px 7px; border-radius: 20px;
    background: #2c3442; color: #9aa3b2; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .deck-spyfall1 { background: #2a3b2e; color: #8fd6a0; }
  .deck-spyfall2 { background: #2a3142; color: #8fb4f0; }
  .deck-delire   { background: #3a2e42; color: #d6a0e8; }

  .loc {
    background: #1d232e; border: 1px solid #2c3442; border-radius: 13px; padding: 12px;
  }
  .loc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .loc-name {
    font-size: 1.05rem; font-weight: 700; flex: 1; min-width: 140px;
    background: transparent; border: none; border-bottom: 1px dashed transparent; color: #e8e6e3; padding: 2px 0;
  }
  .loc-name:focus { outline: none; border-bottom-color: #5b8def; }
  .loc-theme { font-size: 0.8rem; padding: 4px 8px; }
  .roles { list-style: none; margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
  .role {
    display: flex; align-items: center; gap: 8px;
    background: #232b38; border-radius: 8px; padding: 6px 8px;
  }
  .role-text {
    flex: 1; background: transparent; border: none; color: #e8e6e3; font-size: 0.92rem; padding: 4px 2px;
    border-bottom: 1px dashed transparent;
  }
  .role-text:focus { outline: none; border-bottom-color: #5b8def; }
  .role.suspended .role-text { opacity: 0.4; text-decoration: line-through; }
  .role-btn {
    padding: 5px 9px; font-size: 0.82rem; border-radius: 7px; background: #2c3442; border: none; color: #cdd3dc;
  }
  .role-btn.on { background: #c9962f; color: #1a1f29; }
  .role-btn.del { background: #4a2a2a; color: #ff9b8f; }
  .add-role { display: flex; gap: 6px; margin-top: 8px; }
  .loc-foot { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
  .loc-count { font-size: 0.78rem; color: #9aa3b2; }
  .warn-text { color: #ff9b8f; }
  .hidden { display: none !important; }
  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #5b8def; color: #fff; padding: 10px 16px; border-radius: 10px;
    font-size: 0.9rem; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; }
  dialog {
    border: 1px solid #2c3442; background: #1d232e; color: #e8e6e3; border-radius: 14px;
    padding: 18px; width: 90%; max-width: 360px;
  }
  dialog::backdrop { background: rgba(0,0,0,0.6); }
  dialog label { display: block; font-size: 0.8rem; color: #9aa3b2; margin: 10px 0 4px; }
  dialog input, dialog select { width: 100%; }
  dialog .row { display: flex; gap: 8px; margin-top: 16px; }
  dialog .row button { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>🕵️ Éditeur Spyfall</h1>
  <div class="stats" id="stats"></div>
  <div class="actions">
    <button class="primary" id="btn-save-html">💾 Sauver ma version</button>
    <button id="btn-add-loc">＋ Lieu</button>
    <button id="btn-export">⬇️ JSON</button>
    <button id="btn-export-code">📋 locations.js</button>
    <button class="ghost" id="btn-import">⬆️ Importer</button>
    <button class="ghost warn" id="btn-reset">↺ Réinit.</button>
    <input type="file" id="file-import" accept="application/json" class="hidden" />
  </div>
  <div class="controls">
    <input type="search" id="search" placeholder="Rechercher un lieu ou un rôle…" />
    <select id="filter-deck">
      <option value="">Tous les paquets</option>
      <option value="spyfall1">Spyfall 1</option>
      <option value="spyfall2">Spyfall 2</option>
      <option value="delire">Délire</option>
    </select>
    <select id="filter-theme"></select>
  </div>
</header>

<main id="list"></main>

<div class="toast" id="toast"></div>

<dialog id="dlg-loc">
  <h2 style="font-size:1.05rem">Nouveau lieu</h2>
  <label>Nom du lieu</label>
  <input id="dlg-name" maxlength="60" placeholder="ex. Cabine d'essayage" />
  <label>Paquet</label>
  <select id="dlg-deck">
    <option value="delire">Délire (RP)</option>
    <option value="spyfall1">Spyfall 1</option>
    <option value="spyfall2">Spyfall 2</option>
  </select>
  <label>Thème</label>
  <select id="dlg-theme"></select>
  <div class="row">
    <button class="ghost" id="dlg-cancel">Annuler</button>
    <button class="primary" id="dlg-ok">Créer</button>
  </div>
</dialog>

const DECK_LABELS = { spyfall1: "Spyfall 1", spyfall2: "Spyfall 2", delire: "Délire (RP)" };
const STORAGE_KEY = "spyfall-editor-v1";
const BUILD = "b0-original"; // identifiant unique de CE fichier ; change à chaque « Sauver ma version »

let data = load();

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    // On ne reprend le brouillon du navigateur que s'il provient de CE fichier-ci.
    if (saved && saved.build === BUILD && saved.data) return saved.data;
  } catch (e) {}
  return structuredClone(SEED);
}
function save() {
  // Sauvegarde de confort (peut être effacée par le navigateur sur mobile).
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ build: BUILD, data })); } catch (e) {}
  renderStats();
}

// Sauvegarde ROBUSTE : régénère un fichier HTML autonome avec vos modifications
// inscrites « en dur ». Ce fichier devient votre nouvelle sauvegarde — rouvrez-le
// la prochaine fois et tout est là, même hors-ligne, même sans mémoire du navigateur.
function exportHtml() {
  let html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  html = html.replace(/const SEED = .*?;\nconst DECK_LABELS/s,
    "const SEED = " + JSON.stringify(data) + ";\nconst DECK_LABELS");
  html = html.replace(/const BUILD = "[^"]*";/, 'const BUILD = "b' + Date.now() + '";');
  download("spyfall-editeur.html", html);
  toast("Version sauvegardée — rouvrez CE fichier la prochaine fois");
}
function uid() { return Math.random().toString(36).slice(2, 9); }

// ===== Rendu =====
const $ = (id) => document.getElementById(id);

function renderStats() {
  const locs = data.locations.length;
  let active = 0, susp = 0;
  for (const l of data.locations) for (const r of l.roles) (r.s ? susp++ : active++);
  $("stats").textContent = `${locs} lieux · ${active} rôles actifs · ${susp} en suspens`;
}

function fillThemeSelects() {
  const opts = data.themes.map((t) => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
  $("filter-theme").innerHTML = `<option value="">Tous les thèmes</option>` + opts;
  $("dlg-theme").innerHTML = opts;
}

function render() {
  const q = $("search").value.trim().toLowerCase();
  const fDeck = $("filter-deck").value;
  const fTheme = $("filter-theme").value;
  const list = $("list");
  list.innerHTML = "";

  const shown = data.locations.filter((l) => {
    if (fDeck && l.deck !== fDeck) return false;
    if (fTheme && l.theme !== fTheme) return false;
    if (q) {
      const hay = (l.name + " " + l.roles.map((r) => r.t).join(" ")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (!shown.length) {
    list.innerHTML = `<p style="color:#9aa3b2;text-align:center;padding:30px 0">Aucun lieu ne correspond.</p>`;
    return;
  }

  for (const loc of shown) list.appendChild(renderLoc(loc));
}

function renderLoc(loc) {
  const el = document.createElement("section");
  el.className = "loc";
  const activeCount = loc.roles.filter((r) => !r.s).length;
  const warn = activeCount === 0 ? `<span class="warn-text">⚠️ aucun rôle actif</span>` : `${activeCount} rôle(s) actif(s)`;

  el.innerHTML = `
    <div class="loc-head">
      <span class="deck-tag deck-${loc.deck}">${DECK_LABELS[loc.deck]}</span>
      <input class="loc-name" value="${esc(loc.name)}" />
      <select class="loc-theme">${data.themes.map((t) => `<option ${t === loc.theme ? "selected" : ""} value="${esc(t)}">${esc(t)}</option>`).join("")}</select>
    </div>
    <ul class="roles"></ul>
    <div class="add-role">
      <input class="grow new-role" placeholder="Ajouter un rôle…" />
      <button class="primary add-role-btn">＋</button>
    </div>
    <div class="loc-foot">
      <span class="loc-count">${warn}</span>
      <button class="role-btn del del-loc">🗑 Supprimer le lieu</button>
    </div>`;

  // Nom
  el.querySelector(".loc-name").onchange = (e) => { loc.name = e.target.value.trim() || loc.name; save(); };
  // Thème
  el.querySelector(".loc-theme").onchange = (e) => { loc.theme = e.target.value; save(); };
  // Rôles
  const ul = el.querySelector(".roles");
  loc.roles.forEach((role, idx) => ul.appendChild(renderRole(loc, role, idx, el)));
  // Ajout de rôle
  const addInput = el.querySelector(".new-role");
  const doAdd = () => {
    const t = addInput.value.trim();
    if (!t) return;
    loc.roles.push({ t, s: false });
    addInput.value = "";
    save();
    refreshLoc(loc, el);
  };
  el.querySelector(".add-role-btn").onclick = doAdd;
  addInput.onkeydown = (e) => { if (e.key === "Enter") doAdd(); };
  // Suppression du lieu
  el.querySelector(".del-loc").onclick = () => {
    if (confirm(`Supprimer le lieu « ${loc.name} » ?`)) {
      data.locations = data.locations.filter((l) => l.id !== loc.id);
      save();
      render();
    }
  };
  return el;
}

function renderRole(loc, role, idx, locEl) {
  const li = document.createElement("li");
  li.className = "role" + (role.s ? " suspended" : "");
  li.innerHTML = `
    <input class="role-text" value="${esc(role.t)}" />
    <button class="role-btn susp ${role.s ? "on" : ""}">${role.s ? "▶︎" : "⏸"}</button>
    <button class="role-btn del">✕</button>`;
  li.querySelector(".role-text").onchange = (e) => { role.t = e.target.value.trim() || role.t; save(); };
  li.querySelector(".susp").onclick = () => { role.s = !role.s; save(); refreshLoc(loc, locEl); };
  li.querySelector(".del").onclick = () => { loc.roles.splice(idx, 1); save(); refreshLoc(loc, locEl); };
  return li;
}

// Re-rendu d'un seul lieu (préserve le focus de saisie ailleurs)
function refreshLoc(loc, oldEl) {
  const fresh = renderLoc(loc);
  oldEl.replaceWith(fresh);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ===== Ajout de lieu =====
$("btn-add-loc").onclick = () => { $("dlg-name").value = ""; $("dlg-loc").showModal(); };
$("dlg-cancel").onclick = () => $("dlg-loc").close();
$("dlg-ok").onclick = () => {
  const name = $("dlg-name").value.trim();
  if (!name) { $("dlg-name").focus(); return; }
  data.locations.unshift({ id: uid(), deck: $("dlg-deck").value, name, theme: $("dlg-theme").value, roles: [] });
  save();
  $("dlg-loc").close();
  $("search").value = ""; $("filter-deck").value = ""; $("filter-theme").value = "";
  render();
  toast("Lieu ajouté — ajoutez-lui des rôles");
};

// ===== Export / Import =====
$("btn-save-html").onclick = exportHtml;
$("btn-export").onclick = () => {
  download("spyfall-lieux.json", JSON.stringify(data, null, 2));
  toast("Fichier JSON exporté");
};
$("btn-export-code").onclick = () => {
  const code = toLocationsJs(data);
  navigator.clipboard?.writeText(code).then(
    () => toast("locations.js copié dans le presse-papier"),
    () => download("locations.js", code)
  );
};
$("btn-import").onclick = () => $("file-import").click();
$("file-import").onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (!obj.locations || !obj.themes) throw new Error("format");
      data = obj;
      save();
      fillThemeSelects();
      render();
      toast("Import réussi");
    } catch (err) { toast("Fichier invalide"); }
  };
  reader.readAsText(file);
};
$("btn-reset").onclick = () => {
  if (confirm("Tout réinitialiser à la version d'origine ? Vos modifications seront perdues.")) {
    data = structuredClone(SEED);
    save();
    fillThemeSelects();
    render();
    toast("Réinitialisé");
  }
};

// Génère le module locations.js (exclut les rôles en suspens)
function toLocationsJs(d) {
  const decks = { spyfall1: [], spyfall2: [], delire: [] };
  for (const l of d.locations) {
    const roles = l.roles.filter((r) => !r.s).map((r) => r.t);
    (decks[l.deck] || decks.delire).push(`  {\n    name: ${JSON.stringify(l.name)},\n    theme: ${JSON.stringify(l.theme)},\n    roles: ${JSON.stringify(roles)},\n  },`);
  }
  const block = (arr) => `[\n${arr.join("\n")}\n]`;
  return `// Généré par l'éditeur Spyfall. Les rôles mis en suspens ont été exclus.\n` +
    `const spyfall1 = ${block(decks.spyfall1)};\n\n` +
    `const spyfall2 = ${block(decks.spyfall2)};\n\n` +
    `const delire = ${block(decks.delire)};\n\n` +
    `module.exports = {\n` +
    `  spyfall1: { label: "Spyfall 1", locations: spyfall1 },\n` +
    `  spyfall2: { label: "Spyfall 2", locations: spyfall2 },\n` +
    `  both: { label: "Spyfall 1 + 2", locations: [...spyfall1, ...spyfall2] },\n` +
    `  delire: { label: "Délire (RP)", locations: delire },\n` +
    `  tout: { label: "Tout", locations: [...spyfall1, ...spyfall2, ...delire] },\n};\n`;
}

function download(filename, text) {
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

// ===== Démarrage =====
$("search").oninput = render;
$("filter-deck").onchange = render;
$("filter-theme").onchange = render;
fillThemeSelects();
renderStats();
render();
</script>
